<div class="category-select">
  <span class="category-select__title">Categorias</span>
  <div class="category-select__viewport" role="group" aria-label="Categorias disponíveis">
    @if (loading) {
      <p class="category-select__status">Carregando…</p>
    } @else {
      <div class="category-select__list">
        @for (category of orderedCategories; track category.name) {
          <div class="category-select__item" [class.category-select__item--selected]="isSelected(category.name)">
            @if (editing === category.name) {
              <div class="category-select__edit-row">
                <input class="category-select__rename" [(ngModel)]="editingName" maxlength="50" aria-label="Novo nome da categoria"
                  [disabled]="renaming"
                  (keydown.enter)="saveEdit(category.name, $event)" (keydown.escape)="cancelEdit($event)" />
                <button type="button" [disabled]="renaming" (click)="saveEdit(category.name, $event)" aria-label="Salvar nome">{{ renaming ? 'Salvando…' : 'Salvar' }}</button>
                <button type="button" [disabled]="renaming" (click)="cancelEdit($event)" aria-label="Cancelar edição">Cancelar</button>
              </div>
            } @else {
              <label class="category-select__choice">
                <input type="checkbox" [checked]="isSelected(category.name)" [disabled]="disabled || renaming" (change)="toggle(category.name)" />
                <span class="category-select__name">{{ category.name }}</span>
                <small>{{ category.promotionCount }}</small>
              </label>
              <button type="button" class="category-select__edit" [disabled]="disabled || renaming"
                (click)="startEdit(category.name, $event)" [attr.aria-label]="'Editar categoria ' + category.name">✎</button>
            }
          </div>
        } @empty {
          <p class="category-select__status">Nenhuma categoria encontrada.</p>
        }
      </div>
    }
  </div>
  @if (error) { <p class="category-select__error" role="alert">{{ error }}</p> }
</div>
