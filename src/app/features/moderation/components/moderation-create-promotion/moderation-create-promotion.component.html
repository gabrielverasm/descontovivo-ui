<app-moderation-promotion-panel
  mode="create"
  [editForm]="form"
  [newImagePreviewUrl]="imagePreviewUrl"
  [newImageSizeKB]="imageSizeKB"
  [newImageStatusText]="imageStatusText"
  [newImageError]="imageError"
  [soldAndDeliveredByStore]="soldAndDeliveredByStore"
  [actionInProgress]="saving ? 'create' : null"
  [imageBusy]="isImageBusy"
  [formError]="error"
  (create)="submit()"
  (close)="cancel.emit()"
  (toggleSoldDelivered)="toggleSoldDelivered($event)"
  (useStoreForSoldBy)="useStoreForSoldBy()"
  (useStoreForDeliveredBy)="useStoreForDeliveredBy()"
  (copySoldByToDeliveredBy)="copySoldByToDeliveredBy()"
  (imageSelected)="onImageSelected($event)"
  (removeImage)="removeImage()"
  (inspectionLoaded)="applyInspection($event)"
  (inspectionFailed)="inspectionFailed()"
/>
